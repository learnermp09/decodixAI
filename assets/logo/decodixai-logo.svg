<svg viewBox="0 0 1536 1024" xmlns="http://www.w3.org/2000/svg" font-family="'Poppins','Segoe UI',Arial,Helvetica,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <!-- palette -->
  <linearGradient id="arc1" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a89a8c"/>
    <stop offset="1" stop-color="#2b241d"/>
  </linearGradient>
  <linearGradient id="arc2" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c9a37e"/>
    <stop offset="1" stop-color="#6f4e37"/>
  </linearGradient>
  <linearGradient id="arc3" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6f4e37"/>
    <stop offset="1" stop-color="#1c1712"/>
  </linearGradient>

  <linearGradient id="dTop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c9a37e"/>
    <stop offset="1" stop-color="#8c8074"/>
  </linearGradient>

  <linearGradient id="wordAI" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8c6a4a"/>
    <stop offset="1" stop-color="#4a352455"/>
  </linearGradient>
  <linearGradient id="wordAI2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9c7752"/>
    <stop offset="1" stop-color="#3d2c1f"/>
  </linearGradient>

  <linearGradient id="dGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#b08968"/>
    <stop offset="1" stop-color="#1c1712"/>
  </linearGradient>

  <!-- checker fade mask for the "reverse engineer" cube face -->
  <linearGradient id="fadeMask" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
  </linearGradient>
  <mask id="cubeFadeMask">
    <rect x="150" y="150" width="300" height="300" fill="url(#fadeMask)"/>
  </mask>
</defs>

<rect width="1536" height="1024" fill="#faf9f6"/>

<!-- ============ ICON 1 : REVERSE ENGINEER ============ -->
<g>
  <!-- arc -->
  <path d="M 355,150 A 155,155 0 1 1 355,460" fill="none" stroke="url(#arc1)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="355" cy="460" r="10" fill="#4a4038"/>

  <!-- dissolving particles -->
  <g fill="#4a4038">
    <rect x="118" y="214" width="7" height="7" opacity="0.25"/>
    <rect x="150" y="196" width="9" height="9" opacity="0.3"/>
    <rect x="132" y="248" width="6" height="6" opacity="0.22"/>
    <rect x="168" y="232" width="11" height="11" opacity="0.35"/>
    <rect x="140" y="284" width="8" height="8" opacity="0.28"/>
    <rect x="178" y="270" width="13" height="13" opacity="0.4"/>
    <rect x="120" y="320" width="7" height="7" opacity="0.25"/>
    <rect x="160" y="330" width="10" height="10" opacity="0.35"/>
    <rect x="185" y="305" width="15" height="15" opacity="0.45"/>
    <rect x="150" y="360" width="9" height="9" opacity="0.3"/>
    <rect x="195" y="345" width="14" height="14" opacity="0.5"/>
    <rect x="205" y="200" width="12" height="12" opacity="0.42"/>
  </g>

  <!-- cube: left/front face (checker, fading in from left) -->
  <g mask="url(#cubeFadeMask)">
    <rect x="225" y="245" width="130" height="140" fill="#6f4e37"/>
    <g fill="#1c1712" opacity="0.55">
      <rect x="225" y="245" width="16" height="18"/><rect x="257" y="245" width="16" height="18"/><rect x="289" y="245" width="16" height="18"/><rect x="321" y="245" width="16" height="18"/>
      <rect x="241" y="263" width="16" height="18"/><rect x="273" y="263" width="16" height="18"/><rect x="305" y="263" width="16" height="18"/><rect x="337" y="263" width="16" height="18"/>
      <rect x="225" y="281" width="16" height="18"/><rect x="257" y="281" width="16" height="18"/><rect x="289" y="281" width="16" height="18"/><rect x="321" y="281" width="16" height="18"/>
      <rect x="241" y="299" width="16" height="18"/><rect x="273" y="299" width="16" height="18"/><rect x="305" y="299" width="16" height="18"/><rect x="337" y="299" width="16" height="18"/>
      <rect x="225" y="317" width="16" height="18"/><rect x="257" y="317" width="16" height="18"/><rect x="289" y="317" width="16" height="18"/><rect x="321" y="317" width="16" height="18"/>
      <rect x="241" y="335" width="16" height="18"/><rect x="273" y="335" width="16" height="18"/><rect x="305" y="335" width="16" height="18"/><rect x="337" y="335" width="16" height="18"/>
      <rect x="225" y="353" width="16" height="18"/><rect x="257" y="353" width="16" height="18"/><rect x="289" y="353" width="16" height="18"/><rect x="321" y="353" width="16" height="18"/>
    </g>
  </g>

  <!-- top rim (open box) -->
  <polygon points="225,245 300,205 400,205 355,245" fill="#2b241d"/>
  <polygon points="230,248 300,210 300,225 260,248" fill="#1c1712" opacity="0.5"/>
  <!-- right/side face -->
  <polygon points="355,245 400,205 400,345 355,385" fill="#3a3128"/>
  <!-- outline -->
  <polygon points="225,245 300,205 400,205 400,345 355,385 225,385" fill="none" stroke="#1c1712" stroke-width="2" opacity="0.35"/>
</g>
<text x="355" y="512" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="2" fill="#1c1712">REVERSE ENGINEER</text>

<!-- arrow 1 -->
<polygon points="585,290 610,305 585,320" fill="#4a4038"/>

<!-- ============ ICON 2 : UNDERSTAND ============ -->
<g>
  <path d="M 815,150 A 155,155 0 1 1 815,460" fill="none" stroke="url(#arc2)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="815" cy="460" r="10" fill="#8c6a4a"/>

  <!-- dashed wireframe hexagon-ish cube -->
  <g stroke="#b0a598" stroke-width="1.6" stroke-dasharray="4 5" fill="none">
    <polygon points="685,230 770,190 855,230 855,320 770,360 685,320"/>
    <line x1="685" y1="230" x2="770" y2="270"/>
    <line x1="855" y1="230" x2="770" y2="270"/>
    <line x1="770" y1="270" x2="770" y2="360"/>
  </g>

  <!-- network nodes + edges -->
  <g stroke="#9c7752" stroke-width="2">
    <line x1="795" y1="265" x2="865" y2="235"/>
    <line x1="795" y1="265" x2="905" y2="260"/>
    <line x1="795" y1="265" x2="880" y2="330"/>
    <line x1="865" y1="235" x2="905" y2="260"/>
    <line x1="905" y1="260" x2="880" y2="330"/>
    <line x1="795" y1="265" x2="730" y2="245"/>
  </g>
  <g fill="#6f4e37">
    <circle cx="865" cy="235" r="7"/>
    <circle cx="905" cy="260" r="9"/>
    <circle cx="880" cy="330" r="6"/>
    <circle cx="730" cy="245" r="5"/>
  </g>

  <!-- small solid cube core -->
  <polygon points="770,245 800,230 830,245 800,260" fill="#c9a37e"/>
  <polygon points="770,245 800,260 800,300 770,285" fill="#6f4e37"/>
  <polygon points="800,260 830,245 830,285 800,300" fill="#3a2b1e"/>
</g>
<text x="815" y="512" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="2" fill="#1c1712">UNDERSTAND</text>

<!-- arrow 2 -->
<polygon points="1045,290 1070,305 1045,320" fill="#4a4038"/>

<!-- ============ ICON 3 : BUILD ============ -->
<g>
  <path d="M 1275,150 A 155,155 0 1 1 1275,460" fill="none" stroke="url(#arc3)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="1275" cy="460" r="10" fill="#1c1712"/>

  <!-- isometric cube, subdivided 2x2 per face -->
  <!-- top face -->
  <polygon points="1185,240 1275,195 1365,240 1275,285" fill="#c9a37e"/>
  <line x1="1230" y1="217" x2="1320" y2="262" stroke="#faf9f6" stroke-width="2"/>
  <line x1="1320" y1="217" x2="1230" y2="262" stroke="#faf9f6" stroke-width="2"/>
  <!-- left face -->
  <polygon points="1185,240 1275,285 1275,375 1185,330" fill="#6f4e37"/>
  <line x1="1185" y1="285" x2="1275" y2="330" stroke="#faf9f6" stroke-width="2"/>
  <line x1="1230" y1="262" x2="1230" y2="352" stroke="#faf9f6" stroke-width="2"/>
  <!-- right face -->
  <polygon points="1365,240 1275,285 1275,375 1365,330" fill="#2b241d"/>
  <line x1="1365" y1="285" x2="1275" y2="330" stroke="#faf9f6" stroke-width="2"/>
  <line x1="1320" y1="262" x2="1320" y2="352" stroke="#faf9f6" stroke-width="2"/>
  <!-- outline -->
  <polygon points="1185,240 1275,195 1365,240 1365,330 1275,375 1185,330" fill="none" stroke="#1c1712" stroke-width="2" opacity="0.3"/>
</g>
<text x="1275" y="512" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="2" fill="#1c1712">BUILD</text>

<!-- ============ D-ICON + WORDMARK ============ -->
<g>
  <!-- dissolving particles into D -->
  <g fill="#4a4038">
    <rect x="128" y="670" width="7" height="7" opacity="0.25"/>
    <rect x="150" y="655" width="9" height="9" opacity="0.3"/>
    <rect x="140" y="700" width="8" height="8" opacity="0.3"/>
    <rect x="165" y="685" width="11" height="11" opacity="0.4"/>
    <rect x="150" y="735" width="9" height="9" opacity="0.35"/>
    <rect x="178" y="715" width="13" height="13" opacity="0.45"/>
    <rect x="160" y="765" width="10" height="10" opacity="0.4"/>
    <rect x="190" y="745" width="14" height="14" opacity="0.5"/>
  </g>

  <!-- D shape: straight bar + curved stroke -->
  <rect x="210" y="640" width="30" height="220" fill="url(#dGrad)"/>
  <path d="M 240,640 C 320,640 370,690 370,750 C 370,810 320,860 240,860"
        fill="none" stroke="url(#dGrad)" stroke-width="30" stroke-linecap="round"/>

  <!-- mini network inside D -->
  <g stroke="#8c8074" stroke-width="1.8">
    <line x1="270" y1="720" x2="300" y2="700"/>
    <line x1="270" y1="720" x2="245" y2="755"/>
    <line x1="270" y1="720" x2="310" y2="750"/>
    <line x1="300" y1="700" x2="310" y2="750"/>
  </g>
  <g fill="#6f4e37">
    <circle cx="270" cy="720" r="9"/>
    <circle cx="300" cy="700" r="7"/>
    <circle cx="245" cy="755" r="6"/>
    <circle cx="310" cy="750" r="7"/>
  </g>

  <!-- wordmark -->
  <text x="410" y="790" font-size="130" font-weight="800" fill="#1c1712">Decodix<tspan fill="#6f4e37">AI</tspan></text>
</g>

<!-- divider -->
<line x1="410" y1="835" x2="1160" y2="835" stroke="#c9c2b8" stroke-width="1.5"/>
<circle cx="785" cy="835" r="7" fill="#4a4038"/>

<!-- tagline -->
<text x="330" y="900" font-size="28" font-weight="700" letter-spacing="1.5" fill="#4a4038">DECONSTRUCT.</text>
<text x="595" y="900" font-size="28" font-weight="700" letter-spacing="1.5" fill="#c9c2b8">|</text>
<text x="628" y="900" font-size="28" font-weight="700" letter-spacing="1.5" fill="#6f4e37">UNDERSTAND.</text>
<text x="862" y="900" font-size="28" font-weight="700" letter-spacing="1.5" fill="#c9c2b8">|</text>
<text x="895" y="900" font-size="28" font-weight="700" letter-spacing="1.5" fill="#1c1712">BUILD THE FUTURE.</text>

</svg>
